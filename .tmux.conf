# Restore default pane click-to-focus (was accidentally unbound during debugging)
bind -T root MouseDown1Pane 'select-pane -t = ; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } {}'

# Click window name in the windows bar (status-format[1], fires MouseDown1Status)
bind -T root MouseDown1Status "select-window -t ="

# Click agent pill in the agents bar (status-format[0], fires MouseDown1StatusDefault)
bind -T root MouseDown1StatusDefault \
  if -F '#{||:#{m:ag-*,#{mouse_status_range}},#{m:ca-*,#{mouse_status_range}}}' \
    "run-shell '~/.tmux/scripts/agent-jump.sh \"#{mouse_status_range}\"'" \
    ""


