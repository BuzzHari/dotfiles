# Make the active pane obvious and keep pane names visible on folded panes.
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour46,bold'
set -g pane-border-format " #{?pane_active,#[fg=colour46]#[bold]▶ ACTIVE ,#[fg=colour241]· }#[fg=colour255]#{pane_index}: #{=/45/...:pane_title}#[default] "
bind-key u set -g pane-border-status


