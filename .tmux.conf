# Log directory
set-option -g @log_dir "$HOME/.tmux/logs"

# Base filename pattern (without timestamp)
set-option -g @log_base "#{session_name}:#{window_id}:#{pane_id}"

# Auto-start logging on new panes
#set-hook -g after-split-window 'run-shell "mkdir -p #{@log_dir}; tmux pipe-pane -o \"cat >> #{@log_dir}/#{@log_base}.log\""'
#set-hook -g after-new-window 'run-shell "mkdir -p #{@log_dir}; tmux pipe-pane -o \"cat >> #{@log_dir}/#{@log_base}.log\""'
#set-hook -g after-new-session 'run-shell "mkdir -p #{@log_dir}; tmux pipe-pane -o \"cat >> #{@log_dir}/#{@log_base}.log\""'

# View current pane's log (prefix + g)
bind-key g run-shell "cat $HOME/.tmux/logs/#{session_name}:#{window_id}:#{pane_id}.log"

# Edit in vim (prefix + G)
# Use col -b to strip control chars before viewing
bind-key G run-shell "tmux display-popup -E 'col -b < $HOME/.tmux/logs/#{session_name}:#{window_id}:#{pane_id}.log | vim -'"
#bind-key G run-shell "tmux display-popup -E 'cat -v $HOME/.tmux/logs/#{session_name}:#{window_name}:#{pane_id}.log | vim -'"
#bind-key G run-shell "tmux display-popup -E 'vim $HOME/.tmux/logs/#{session_name}:#{window_name}:#{pane_id}.log'"

# Git vimdiff popup (prefix + V)
bind-key V popup -w 90% -h 90% -E -d '#{pane_current_path}' 'git difftool -t vimdiff'

# Compress logs older than 60 days (prefix + Y)
bind-key Y run-shell "command find #{@log_dir} -name '*.log' -mtime 60 -exec gzip {} \\; && tmux display-message 'Compressed old logs'"


# Disable pane preview
bind-key w choose-tree -ZwN 

# VIM MODEEE
setw -g mode-keys vi

# VIM IS THE WAYY
bind-key C-h select-pane -L
bind-key h select-pane -L
bind-key C-j select-pane -D
bind-key j select-pane -D
bind-key C-k select-pane -U
bind-key k select-pane -U
bind-key C-l select-pane -R
bind-key l select-pane -R
#bind-key z resize-pane -Z
# Toggle the focused pane between its saved size and a one-line collapsed state.
# Use prefix + C-z; pass x or y as a second argument for an explicit axis.
bind-key C-z run-shell "~/.tmux/scripts/toggle-pane-collapse.sh '#{pane_id}'"
# Direct toggle for the focused pane: press F10 (no tmux prefix).
bind-key -n F10 run-shell "~/.tmux/scripts/toggle-pane-collapse.sh '#{pane_id}'"

# VIM splitting
bind-key s split-window -v -c "#{pane_current_path}"
bind-key v split-window -h -c "#{pane_current_path}"

# VIM copy
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'r' send-keys -X rectangle-selection

# The desktop clipboard helper is local-only.  On an SSH host, tmux itself
# sends the selection to the local terminal through OSC 52; running xclip,
# wl-copy, or pbcopy on the VM would target the VM's (usually nonexistent)
# desktop instead.
if-shell -F '#{SSH_CONNECTION}' {
    # Remote tmux: let tmux send the selection to the local Kitty terminal.
    bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel
    bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
    bind-key -T copy-mode-vi C-j send-keys -X copy-selection-and-cancel
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
    bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-selection-and-cancel
    bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-selection-and-cancel
} {
    # Local tmux: use the desktop clipboard helper (xclip, wl-copy, pbcopy).
    bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "~/.tmux/scripts/copy-to-system-clipboard.sh"
    bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "~/.tmux/scripts/copy-to-system-clipboard.sh"
    bind-key -T copy-mode-vi C-j send-keys -X copy-pipe-and-cancel "~/.tmux/scripts/copy-to-system-clipboard.sh"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "~/.tmux/scripts/copy-to-system-clipboard.sh"
    bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "~/.tmux/scripts/copy-to-system-clipboard.sh"
    bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "~/.tmux/scripts/copy-to-system-clipboard.sh"
}

# Swap Windows
bind-key C-S-Left swap-window -t -1\; select-window -t -1
bind-key C-S-Right swap-window -t +1\; select-window -t +1


