set -g focus-events on

# Remote Kitty integration.
#
# SSH_CONNECTION identifies a tmux server started on an SSH host.  The
# client_termname check is client-specific, so a local Kitty tmux does not
# receive these settings.  The client-attached hook handles the first attach
# after a new tmux server starts; the if-shell handles source-file reloads
# performed while already attached.
if-shell -F '#{&&:#{SSH_CONNECTION},#{==:#{client_termname},xterm-kitty}}' {
    set -g allow-passthrough on
    set -as terminal-features ',xterm-kitty:clipboard:hyperlinks'
    set -s set-clipboard on
}
set-hook -g client-attached {
    if-shell -F '#{&&:#{SSH_CONNECTION},#{==:#{client_termname},xterm-kitty}}' {
        set -g allow-passthrough on
        set -as terminal-features ',xterm-kitty:clipboard:hyperlinks'
        set -s set-clipboard on
    }
}

